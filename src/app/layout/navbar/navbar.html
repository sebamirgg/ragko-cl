<header
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-500"
  [class]="scrolled() || menuOpen()
    ? 'theme-light bg-obsidian/95 backdrop-blur-md py-3 border-b border-line shadow-[0_10px_30px_-20px_rgba(30,26,22,0.5)]'
    : 'theme-dark bg-gradient-to-b from-obsidian/60 to-transparent py-5'">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">

    <!-- Logotipo -->
    <a href="#hero" class="flex items-center gap-3.5 group" [attr.aria-label]="t().nav.home">
      <div class="w-11 h-11 rounded-full ragko-medallion flex items-center justify-center group-hover:scale-105 transition-transform duration-300">
        <app-ragko-mark class="w-7 h-7 text-amber" [strokeWidth]="6.5" />
      </div>
      <div class="flex flex-col">
        <div class="flex items-center">
          <span class="text-2xl font-bold tracking-tight text-accent leading-none">Ragk</span>
          <app-ragko-mark class="w-5 h-5 text-accent ml-0.5 mt-1" [strokeWidth]="8.5" />
        </div>
      </div>
    </a>

    <!-- Navegación escritorio -->
    <nav [attr.aria-label]="t().nav.mainNav"
         class="hidden xl:flex items-center gap-3.5 2xl:gap-6 mr-auto ml-6 2xl:ml-8 pl-6 2xl:pl-8 border-l border-bone/25 h-8 text-[10.5px] 2xl:text-xs font-medium tracking-[0.16em] uppercase text-bone/75">
      @for (item of navItems; track item.anchor) {
        <a [href]="'#' + item.anchor" class="whitespace-nowrap hover:text-accent transition">{{ t().nav[item.label] }}</a>
      }
    </nav>

    <!-- Idioma + CTA + menú móvil -->
    <div class="flex items-center gap-2.5 sm:gap-3">
      <app-language-switcher />

      <a href="#contacto"
         class="btn-primary hidden sm:inline-flex whitespace-nowrap !gap-2 !px-5 !py-2.5 !text-[11px] uppercase !tracking-[0.14em]">
        <span>{{ t().nav.cta }}</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </a>

      <button
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? t().nav.closeMenu : t().nav.openMenu"
        class="xl:hidden w-10 h-10 rounded-full border border-bone/20 text-bone flex items-center justify-center hover:border-accent transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          @if (menuOpen()) {
            <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
          } @else {
            <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h10" />
          }
        </svg>
      </button>
    </div>
  </div>

  <!-- Menú móvil / tablet -->
  @if (menuOpen()) {
    <div id="mobile-menu" class="xl:hidden border-t border-line mt-3 animate-fade-up max-h-[calc(100vh-5rem)] overflow-y-auto">
      <nav [attr.aria-label]="t().nav.mainNav" class="max-w-7xl mx-auto px-4 sm:px-6 py-5 grid sm:grid-cols-2 gap-1.5">
        @for (item of navItems; track item.anchor) {
          <a [href]="'#' + item.anchor" (click)="menuOpen.set(false)"
             class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold text-bone hover:bg-graphite hover:text-hl transition">
            <svg class="w-3.5 h-3.5 text-honey shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" />
            </svg>
            {{ t().nav[item.label] }}
          </a>
        }
      </nav>
      <div class="max-w-7xl mx-auto px-4 sm:px-6 pb-6 space-y-4">
        <div class="text-[11px] font-bold uppercase tracking-[0.2em] text-accent">{{ t().nav.language }}</div>
        <app-language-switcher variant="inline" />
        <a href="#contacto" (click)="menuOpen.set(false)"
           class="btn-primary sm:hidden w-full !text-xs uppercase !tracking-[0.14em]">
          {{ t().nav.cta }}
        </a>
      </div>
    </div>
  }
</header>
