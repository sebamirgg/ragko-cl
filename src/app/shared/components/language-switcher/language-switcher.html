@if (variant() === 'inline') {
  <div role="group" [attr.aria-label]="t().nav.language" class="grid grid-cols-3 gap-2">
    @for (lang of i18n.languages; track lang.code) {
      <button
        type="button"
        (click)="select(lang.code)"
        [attr.aria-pressed]="lang.code === i18n.lang()"
        [attr.lang]="lang.locale"
        class="flex flex-col items-center gap-1.5 rounded-2xl border px-3 py-3 transition cursor-pointer"
        [class]="lang.code === i18n.lang()
          ? 'border-terracotta bg-terracotta/10 text-hl'
          : 'border-line bg-graphite text-muted hover:text-bone hover:border-terracotta/50'">
        <app-flag [code]="lang.flag" class="w-7 h-5" />
        <span class="text-xs font-semibold">{{ lang.name }}</span>
        <span class="text-[11px] font-bold tracking-widest opacity-70">{{ lang.short }}</span>
      </button>
    }
  </div>
} @else {
  <button
    #trigger
    type="button"
    (click)="toggle()"
    (keydown.arrowDown)="open() ? moveFocus($event, 1) : toggle()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="menuId"
    aria-haspopup="menu"
    [attr.aria-label]="t().nav.changeLanguage + ': ' + current().name"
    class="flex items-center gap-2 rounded-full border border-line bg-graphite pl-2 pr-2.5 py-1.5 text-xs font-bold text-bone hover:border-accent transition cursor-pointer">
    <app-flag [code]="current().flag" />
    <span class="tracking-wider">{{ current().short }}</span>
    <svg class="w-3 h-3 text-accent transition-transform duration-200" [class.rotate-180]="open()"
         fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (open()) {
    <div
      [id]="menuId"
      role="menu"
      [attr.aria-label]="t().nav.language"
      (keydown.arrowDown)="moveFocus($event, 1)"
      (keydown.arrowUp)="moveFocus($event, -1)"
      (keydown.tab)="close()"
      class="absolute right-0 top-full mt-2 w-52 rounded-2xl border border-line bg-graphite/95 backdrop-blur-md p-1.5 shadow-2xl animate-fade-up z-50">
      <div class="px-3 pt-1.5 pb-2 text-[11px] font-bold uppercase tracking-[0.2em] text-accent">
        {{ t().nav.language }}
      </div>
      @for (lang of i18n.languages; track lang.code) {
        <button
          #option
          type="button"
          role="menuitemradio"
          [attr.aria-checked]="lang.code === i18n.lang()"
          [attr.lang]="lang.locale"
          (click)="select(lang.code)"
          class="w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm transition cursor-pointer focus:outline-none focus-visible:bg-line hover:bg-line"
          [class.text-hl]="lang.code === i18n.lang()"
          [class.text-bone]="lang.code !== i18n.lang()">
          <app-flag [code]="lang.flag" class="w-6 h-4" />
          <span class="flex-1 font-medium">{{ lang.name }}</span>
          <span class="text-[11px] font-bold tracking-widest text-muted">{{ lang.short }}</span>
          <svg class="w-4 h-4 text-honey" [class.invisible]="lang.code !== i18n.lang()"
               fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </button>
      }
    </div>
  }
}
