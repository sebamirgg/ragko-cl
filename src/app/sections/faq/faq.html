<section id="faq" aria-labelledby="faq-title" class="theme-dark relative py-20 sm:py-28 bg-obsidian border-b border-line overflow-hidden">
  <div class="absolute inset-0 honeycomb-bg honeycomb-corner-bl pointer-events-none" aria-hidden="true"></div>

  <div class="hidden md:block"><app-bee flight="b" class="absolute w-8 h-7 top-24 right-[10%] opacity-70" /></div>

  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid lg:grid-cols-12 gap-10 lg:gap-14">

      <!-- Encabezado -->
      <div class="lg:col-span-4 space-y-5 lg:sticky lg:top-28 self-start" appReveal>
        <span class="kicker-pill">{{ t().faq.kicker }}</span>
        <h2 id="faq-title" class="display-title">{{ t().faq.title }}</h2>
        <app-hex-divider />
        <p class="lead">{{ t().faq.subtitle }}</p>

        <div class="relative hidden lg:block h-64 rounded-3xl overflow-hidden border border-line">
          <img [src]="image.src" [alt]="t().faq.imageAlt" [width]="image.width" [height]="image.height"
               loading="lazy" decoding="async" class="w-full h-full object-cover object-[50%_60%]" />
          <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/20 to-transparent"></div>
        </div>

        <a [href]="contact.whatsappUrl()" target="_blank" rel="noopener noreferrer"
           class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-hl hover:text-honey transition">
          {{ t().faq.more }} →
        </a>
      </div>

      <!-- Acordeón -->
      <div class="lg:col-span-8 space-y-3">
        @for (item of t().faq.items; track $index; let i = $index) {
          <div appReveal [revealDelay]="(i % 4) * 70"
               class="item rounded-2xl border bg-charcoal transition-colors duration-300"
               [class.is-open]="open() === i"
               [class]="open() === i
                 ? 'border-terracotta/60 shadow-[0_12px_40px_-12px_rgba(205,134,81,0.35)]'
                 : 'border-line hover:border-terracotta/35'">
            <h3>
              <button
                type="button"
                (click)="toggle(i)"
                [attr.aria-expanded]="open() === i"
                [attr.aria-controls]="'faq-panel-' + i"
                [id]="'faq-btn-' + i"
                class="w-full flex items-center gap-4 text-left px-5 sm:px-6 py-5 cursor-pointer group">
                <span class="relative shrink-0 w-9 h-9 flex items-center justify-center transition-colors"
                      [class.text-ink]="open() === i" [class.text-honey]="open() !== i">
                  <svg viewBox="0 0 24 24" class="hex-shape absolute inset-0 w-9 h-9" aria-hidden="true">
                    <path d="M12 1.5l9.1 5.25v10.5L12 22.5l-9.1-5.25V6.75z"
                          [attr.fill]="open() === i ? '#E9B25C' : 'none'" stroke="#E9B25C" stroke-width="1.4" />
                  </svg>
                  <svg viewBox="0 0 24 24" class="relative w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                    <path [attr.d]="open() === i ? 'M6 12h12' : 'M12 6v12M6 12h12'" />
                  </svg>
                </span>
                <span class="flex-1 text-sm sm:text-base font-semibold text-bone group-hover:text-hl transition">{{ item.question }}</span>
                <span class="hidden sm:inline text-[11px] uppercase tracking-[0.18em] text-accent font-bold">{{ item.category }}</span>
              </button>
            </h3>
            <div class="panel" [class.is-open]="open() === i" [id]="'faq-panel-' + i" role="region"
                 [attr.aria-labelledby]="'faq-btn-' + i" [attr.aria-hidden]="open() !== i">
              <div>
                <p class="px-5 sm:px-6 pb-6 pl-[4.25rem] sm:pl-[4.75rem] text-sm text-muted leading-relaxed">{{ item.answer }}</p>
              </div>
            </div>
          </div>
        }
      </div>

    </div>
  </div>
</section>
