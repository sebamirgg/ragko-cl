<section id="contacto" aria-labelledby="contacto-title" class="theme-light surface-cream section-edge relative py-20 sm:py-28 overflow-hidden">
  <div class="absolute inset-0 honeycomb-fine" aria-hidden="true"></div>

  <div class="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Tarjeta de cierre boutique: sin formularios, conversación directa -->
    <div appReveal class="card-warm rounded-[2rem] overflow-hidden grid lg:grid-cols-5">

      <figure class="relative lg:col-span-2 h-64 sm:h-80 lg:h-auto bg-ink">
        <img
          [src]="photo.src"
          [alt]="t().territory.photoAlt"
          [width]="photo.width"
          [height]="photo.height"
          loading="lazy"
          decoding="async"
          class="absolute inset-0 w-full h-full object-cover object-[22%_50%]" />
        <div class="absolute inset-0 bg-gradient-to-t from-ink/70 via-transparent to-transparent lg:bg-gradient-to-r lg:from-transparent lg:to-ink/10"></div>
        <figcaption class="absolute bottom-5 left-6 right-6 flex items-center gap-3 text-cream">
          <span class="w-10 h-10 rounded-full ragko-medallion flex items-center justify-center shrink-0">
            <app-ragko-mark class="w-6 h-6 text-amber" [strokeWidth]="6.5" />
          </span>
          <span class="text-[10px] uppercase tracking-[0.24em] text-cream/85">{{ t().brand.cooperative }}</span>
        </figcaption>
      </figure>

      <div class="lg:col-span-3 p-7 sm:p-12 lg:p-14 flex flex-col justify-center">
        <span class="kicker-pill">{{ t().contact.kicker }}</span>
        <h2 id="contacto-title" class="display-title mt-5">{{ t().contact.title }}</h2>
        <p class="lead mt-5">{{ t().contact.subtitle }}</p>

        <div class="mt-9 flex flex-col items-start gap-5">
          <a [href]="contact.whatsappUrl()" target="_blank" rel="noopener noreferrer"
             class="btn-primary w-full sm:w-auto sm:whitespace-nowrap !text-base !py-[1.15rem] !px-8">
            <app-whatsapp-icon class="w-5 h-5" />
            <span>{{ t().contact.whatsappButton }}</span>
          </a>
          <button type="button" (click)="ui.openLabReport()"
                  class="inline-flex items-center gap-2 text-sm font-medium text-bone hover:text-accent transition cursor-pointer underline decoration-amber/40 underline-offset-[6px] hover:decoration-amber">
            {{ t().contact.dossierButton }}
          </button>
        </div>

        <div class="mt-10 pt-8 border-t border-[var(--hairline)] flex flex-col sm:flex-row sm:items-center justify-between gap-5">
          <span class="spec-label max-w-[16rem] leading-relaxed">{{ t().contact.socialLabel }}</span>
          <app-social-links [whatsapp]="false" />
        </div>
      </div>
    </div>
  </div>
</section>
