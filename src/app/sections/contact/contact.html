<section id="contacto" aria-labelledby="contacto-title" class="theme-light relative py-24 sm:py-32 bg-charcoal overflow-hidden">
  <app-bee flight="a" class="absolute hidden md:block w-8 h-7 top-20 left-[12%] z-20 opacity-75" />

  <div class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <div appReveal class="rounded-[2.2rem] bg-gradient-to-b from-graphite to-charcoal border border-terracotta/40 p-7 sm:p-14 text-center shadow-2xl space-y-8">

      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full ragko-medallion mx-auto">
        <app-ragko-mark class="w-11 h-11 text-accent" />
      </div>

      <div class="space-y-4 max-w-2xl mx-auto">
        <span class="block text-xs font-bold uppercase tracking-[0.25em] text-accent">{{ t().contact.kicker }}</span>
        <h2 id="contacto-title" class="font-serif text-3xl sm:text-5xl font-semibold text-bone leading-tight">{{ t().contact.title }}</h2>
        <p class="text-sm sm:text-base text-muted leading-relaxed">{{ t().contact.subtitle }}</p>
      </div>

      <div class="pt-2 flex flex-col items-center gap-4">
        <a [href]="contact.whatsappUrl()" target="_blank" rel="noopener noreferrer"
           class="inline-flex items-center justify-center gap-3.5 bg-terracotta hover:bg-terracotta-dark text-ink font-bold text-base sm:text-lg px-7 sm:px-9 py-5 rounded-full transition-all duration-300 whatsapp-glow hover:-translate-y-0.5 w-full sm:w-auto">
          <app-whatsapp-icon class="w-6 h-6" />
          <span>{{ t().contact.whatsappButton }}</span>
        </a>

        <div class="flex flex-wrap items-center justify-center gap-3 pt-1">
          <button type="button" (click)="ui.openLabReport()"
                  class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-obsidian border border-line hover:border-terracotta text-xs font-semibold text-hl transition cursor-pointer">
            <svg class="w-4 h-4 text-accent" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span>{{ t().contact.dossierButton }}</span>
          </button>

          <a [href]="contact.emailUrl()"
             class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-obsidian border border-line hover:border-terracotta text-xs font-semibold text-muted hover:text-bone transition break-all">
            <svg class="w-4 h-4 text-accent shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <span>{{ contact.email }}</span>
          </a>
        </div>
      </div>

      <div class="pt-6 border-t border-line flex flex-col items-center gap-4">
        <span class="text-[11px] uppercase tracking-[0.22em] text-muted">{{ t().contact.socialLabel }}</span>
        <div class="flex flex-wrap items-center justify-center gap-4">
          <a [href]="contact.social.instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram · Cooperativa Ragko"
             class="group flex items-center gap-3 px-5 py-2.5 rounded-full bg-obsidian border border-line hover:border-terracotta transition">
            <span class="w-9 h-9 rounded-full bg-cream border border-terracotta text-accent flex items-center justify-center group-hover:scale-105 transition-transform">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
                <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z" />
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
              </svg>
            </span>
            <span class="text-xs font-semibold text-bone group-hover:text-hl">Instagram</span>
          </a>
          <a [href]="contact.social.facebook" target="_blank" rel="noopener noreferrer" aria-label="Facebook · Cooperativa Ragko"
             class="group flex items-center gap-3 px-5 py-2.5 rounded-full bg-obsidian border border-line hover:border-terracotta transition">
            <span class="w-9 h-9 rounded-full bg-cream border border-terracotta text-accent flex items-center justify-center group-hover:scale-105 transition-transform">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z" />
              </svg>
            </span>
            <span class="text-xs font-semibold text-bone group-hover:text-hl">Facebook</span>
          </a>
        </div>
      </div>

    </div>
  </div>
</section>
