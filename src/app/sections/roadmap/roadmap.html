<section id="ruta-do" aria-labelledby="ruta-title" class="theme-light surface-sand section-edge relative py-20 sm:py-28 border-b border-line overflow-hidden">
  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <app-section-heading
      class="max-w-3xl mb-16 sm:mb-20"
      align="left"
      titleId="ruta-title"
      [kicker]="t().roadmap.kicker"
      [title]="t().roadmap.title"
      [subtitle]="t().roadmap.subtitle" />

    <!-- Línea de tiempo editorial: vertical en móvil, horizontal en escritorio -->
    <ol class="relative grid lg:grid-cols-4 gap-12 lg:gap-10">
      <span class="timeline-line absolute lg:hidden left-[7px] top-2 bottom-2 w-px" aria-hidden="true"></span>
      <span class="timeline-line timeline-line--h hidden lg:block absolute left-0 right-0 top-[7px] h-px" aria-hidden="true"></span>

      @for (step of t().roadmap.steps; track $index; let i = $index; let last = $last) {
        <li appReveal [revealDelay]="i * 120" class="relative pl-12 lg:pl-0 lg:pt-14">
          <svg class="absolute left-0 top-0 w-[15px] h-[15px]" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"
                  [attr.fill]="last ? '#B8722C' : '#F0E0BD'" stroke="#B8722C" stroke-width="2" />
          </svg>

          <div class="flex items-baseline gap-4">
            <span class="font-serif text-6xl leading-none text-amber/60 tabular-nums">0{{ i + 1 }}</span>
            <span class="spec-label">{{ step.months }}</span>
          </div>
          <h3 class="font-serif text-2xl font-medium tracking-tight text-bone mt-4">{{ step.title }}</h3>
          <p class="text-sm text-muted leading-relaxed mt-3 max-w-xs">{{ step.desc }}</p>
        </li>
      }
    </ol>

    <!-- Referentes internacionales -->
    <div class="mt-20 sm:mt-24 pt-10 border-t border-[var(--hairline)]" appReveal>
      <div class="kicker-pill mb-10">{{ t().roadmap.benchKicker }}</div>
      <div class="grid md:grid-cols-2 gap-10 md:gap-0 md:divide-x md:divide-[var(--hairline)]">
        @for (bench of t().roadmap.benchmarks; track bench.code; let first = $first) {
          <figure class="flex items-start gap-6" [class]="first ? 'md:pr-12' : 'md:pl-12'">
            <span class="font-serif italic text-5xl text-amber leading-none shrink-0 w-14">{{ bench.code }}</span>
            <figcaption>
              <h4 class="font-serif text-xl font-medium text-bone tracking-tight">{{ bench.name }}</h4>
              <p class="text-sm text-muted mt-2 leading-relaxed">{{ bench.desc }}</p>
            </figcaption>
          </figure>
        }
      </div>
    </div>
  </div>
</section>
